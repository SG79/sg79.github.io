<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#fafaf9">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <link rel="manifest" href="manifest.json">
    
    <title>MacroTracker IA - Fitness Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            background-color: #fafaf9;
            color: #44403c; 
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', sans-serif;
            overflow: hidden; 
            margin: 0;
            width: 100%;
            height: 100%;
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type="number"] { -moz-appearance: textfield; }

        .slide-in-next { 
            animation: slideInNext 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }
        .slide-in-prev { 
            animation: slideInPrev 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }
        
        @keyframes slideInNext {
            from { opacity: 0; transform: translateX(28px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInPrev {
            from { opacity: 0; transform: translateX(-28px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .smooth-enter { 
            animation: smoothEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @keyframes smoothEnter { 
            from { opacity: 0; transform: translateY(10px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .pulse-glow {
            animation: pulseGlow 1.8s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.45)); }
        }

        .glow-card { box-shadow: 0 0 25px rgba(52, 211, 153, 0.25); }
    </style>
</head>
<body class="w-screen h-screen flex justify-center">

    <div id="app" class="w-full max-w-md h-full flex flex-col relative bg-stone-50 shadow-2xl border-x border-stone-200 overflow-hidden pb-[env(safe-area-inset-bottom)]"></div>

    <script>
        // --- ICONOS SVG ---
        const Icons = {

            Flame: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',

            Plus: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
            Trash: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
        };

        const getLocalDateStr = (d = new Date()) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const formatDisplayDate = (dateStr) => {
            const todayStr = getLocalDateStr();
            if (dateStr === todayStr) return "Hoy";
            const [y, m, d] = dateStr.split('-');
            const dateObj = new Date(y, m - 1, d);
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            if (dateStr === getLocalDateStr(yesterday)) return "Ayer";
            const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
            if (dateStr === getLocalDateStr(tomorrow)) return "Mañana";
            return dateObj.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        };

        const DEFAULT_SETTINGS = {
            profile: { name: '', weight: '', age: '', height: '', goal: 'bulk_clean', activity: '1.375' },
            goals: { p: 140, c: 280, f: 65 },
            geminiApiKey: '',
            geminiModel: 'gemini-2.5-flash-lite',
            templates: [
                { id: 'm1', name: 'Desayuno', targetP: '', targetC: '', targetF: '' },
                { id: 'm2', name: 'Almuerzo', targetP: '', targetC: '', targetF: '' },
                { id: 'm3', name: 'Merienda', targetP: '', targetC: '', targetF: '' },
                { id: 'm4', name: 'Cena', targetP: '', targetC: '', targetF: '' }
            ]
        };

        const hasCompletedOnboarding = localStorage.getItem('mt_onboarding_completed') === 'true';

        let state = {
            settings: JSON.parse(localStorage.getItem('mt_cleanbulk_settings')) || DEFAULT_SETTINGS,
            history: JSON.parse(localStorage.getItem('mt_cleanbulk_history')) || {},
            currentDate: getLocalDateStr(),
            slideDir: 'next',
            activeMealId: 'm1',
            modal: hasCompletedOnboarding ? null : 'onboarding',
            onboardingStep: 1,
            tempOnboarding: { name: '', weight: '', height: '', age: '', activity: '1.375', goal: 'bulk_clean' },
            aiHubTab: 'scan',
            aiLoading: false,
            aiResult: null,
            advisorAdvice: null,
            advisorError: null,
            selectedPhotoPreview: null,
            selectedPhotoBase64: null,
            calendarViewMode: 'calendar',
            calendarViewDate: new Date()
        };

        // Fallback para modelos en caso de clave desactualizada
        if (!state.settings.geminiModel) {
            state.settings.geminiModel = 'gemini-2.5-flash-lite';
        }

        const saveState = () => {
            localStorage.setItem('mt_cleanbulk_settings', JSON.stringify(state.settings));
            localStorage.setItem('mt_cleanbulk_history', JSON.stringify(state.history));
        };

        let toastTimer = null;
        function showCustomToast(msg) {
            let toast = document.getElementById('native-app-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'native-app-toast';
                toast.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[300] bg-stone-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2 font-bold text-xs border border-stone-700 pointer-events-none transition-all duration-300 opacity-0 -translate-y-4';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2500);
        }

        // --- CÁLCULO DE RACHA CORREGIDO ---
        const calculateStreak = () => {
            let streak = 0;
            let checkDate = new Date();
            const checkMet = (dStr) => {
                const dData = state.history[dStr];
                if (!dData) return false;
                let p = 0, c = 0, f = 0;
                Object.values(dData).forEach(m => {
                    p += Number(m.p) || 0;
                    c += Number(m.c) || 0;
                    f += Number(m.f) || 0;
                });
                return p >= state.settings.goals.p && c >= state.settings.goals.c && f >= state.settings.goals.f;
            };

            const todayMet = checkMet(getLocalDateStr(checkDate));
            if (todayMet) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            } else {
                // Si hoy todavía no se cumple, verificamos desde ayer hacia atrás para no reiniciar racha a mitad del día
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (true) {
                if (checkMet(getLocalDateStr(checkDate))) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        };

        function computeMacrosEngine(w, h, a, act, goal) {
            const weight = parseFloat(w);
            const height = parseFloat(h);
            const age = parseFloat(a);
            const activity = parseFloat(act) || 1.375;

            if (weight > 0 && height > 0 && age > 0) {
                const bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
                const maintenanceCals = bmr * activity;
                
                let targetCals = maintenanceCals;
                let protMultiplier = 2.0;
                let fatMultiplier = 0.9;
                let goalName = "Volumen Limpio";

                if (goal === 'bulk_clean') {
                    targetCals = maintenanceCals + 300;
                    protMultiplier = 2.0;
                    fatMultiplier = 0.9;
                    goalName = "Volumen Limpio 🌱";
                } else if (goal === 'bulk_normal') {
                    targetCals = maintenanceCals + 500;
                    protMultiplier = 1.9;
                    fatMultiplier = 1.0;
                    goalName = "Volumen Normal ⚡";
                } else if (goal === 'cut') {
                    targetCals = maintenanceCals - 450;
                    protMultiplier = 2.2;
                    fatMultiplier = 0.8;
                    goalName = "Definición 🔥";
                } else if (goal === 'recomp') {
                    targetCals = maintenanceCals;
                    protMultiplier = 2.2;
                    fatMultiplier = 0.85;
                    goalName = "Recomposición Corporal 🔄";
                }

                const suggP = Math.round(weight * protMultiplier);
                const suggF = Math.round(weight * fatMultiplier);
                const remainingCals = targetCals - (suggP * 4) - (suggF * 9);
                const suggC = Math.max(0, Math.round(remainingCals / 4));

                return {
                    p: suggP,
                    c: suggC,
                    f: suggF,
                    cals: Math.round(targetCals),
                    goalName
                };
            }
            return { p: 140, c: 280, f: 65, cals: 2200, goalName: "Estándar" };
        }

        // --- CÁLCULO DE METAS ADAPTATIVAS PRECISO (AUTO / MANUAL / SEMI-AUTO) ---
        function calculateAdaptiveAllocation(meals, activeMeal, remDailyP, remDailyC, remDailyF, dailyGoals) {
            if (!activeMeal || activeMeal.completed) {
                return { sugP: 0, sugC: 0, sugF: 0, isAdapted: false, isManual: false };
            }

            const incompleteMeals = meals.filter(m => !m.completed);
            
            const allocateMacro = (macroKey, targetKey, goalDaily) => {
                // Sumar lo consumido en comidas ya finalizadas
                const completedSum = meals.filter(m => m.completed).reduce((acc, m) => acc + (Number(m[macroKey]) || 0), 0);
                const currentPool = Math.max(0, goalDaily - completedSum);

                const manuals = incompleteMeals.filter(m => Number(m[targetKey]) > 0);
                const autos = incompleteMeals.filter(m => !Number(m[targetKey]) || Number(m[targetKey]) <= 0);
                const totalManualTargets = manuals.reduce((acc, m) => acc + Number(m[targetKey]), 0);

                const activeTarget = Number(activeMeal[targetKey]) || 0;
                const isManual = activeTarget > 0;
                let isAdapted = false;
                let result = 0;

                if (isManual) {
                    if (totalManualTargets > currentPool) {
                        // El pool disponible no cubre todas las metas manuales -> Reducción proporcional equitativa
                        isAdapted = true;
                        result = totalManualTargets > 0 ? Math.round((activeTarget / totalManualTargets) * currentPool) : 0;
                    } else {
                        // El pool cubre perfectamente la meta manual
                        result = activeTarget;
                    }
                } else {
                    // Comida automática: toma del pool disponible después de reservar las metas manuales
                    const leftoverForAutos = Math.max(0, currentPool - totalManualTargets);
                    if (autos.length === 1) {
                        result = leftoverForAutos;
                    } else if (autos.length > 1) {
                        result = Math.round(leftoverForAutos / autos.length);
                    } else {
                        result = 0;
                    }
                }

                return {
                    sug: Math.max(0, result),
                    isManual,
                    isAdapted
                };
            };

            const pAlloc = allocateMacro('p', 'targetP', dailyGoals.p);
            const cAlloc = allocateMacro('c', 'targetC', dailyGoals.c);
            const fAlloc = allocateMacro('f', 'targetF', dailyGoals.f);

            return {
                sugP: pAlloc.sug,
                sugC: cAlloc.sug,
                sugF: fAlloc.sug,
                isAdapted: pAlloc.isAdapted || cAlloc.isAdapted || fAlloc.isAdapted,
                isManual: pAlloc.isManual || cAlloc.isManual || fAlloc.isManual
            };
        }

        // --- ACTUALIZACIÓN Y SINCRONIZACIÓN DE MACROS EN TIEMPO REAL ---
        function handleMacroInputLive(type, val) {
            const dayData = state.history[state.currentDate] || {};
            const mealData = dayData[state.activeMealId] || { p: '', c: '', f: '', completed: false };
            
            const cleanVal = val === '' ? '' : Math.max(0, parseInt(val, 10) || 0);
            mealData[type] = cleanVal;
            dayData[state.activeMealId] = mealData;
            state.history[state.currentDate] = dayData;
            saveState();

            updateDashboardNumbers();
        }

        function adjustMacroLive(type, delta) {
            const input = document.getElementById(`active_input_${type}`);
            if (!input) return;
            const currentVal = Number(input.value) || 0;
            const newVal = Math.max(0, currentVal + delta);
            input.value = newVal === 0 ? '' : newVal;
            handleMacroInputLive(type, input.value);
        }

        function updateDashboardNumbers() {
            const activeDateData = state.history[state.currentDate] || {};
            const meals = state.settings.templates.map(t => ({
                id: t.id,
                name: t.name,
                targetP: parseInt(t.targetP, 10) || 0,
                targetC: parseInt(t.targetC, 10) || 0,
                targetF: parseInt(t.targetF, 10) || 0,
                p: activeDateData[t.id]?.p !== undefined ? activeDateData[t.id].p : '',
                c: activeDateData[t.id]?.c !== undefined ? activeDateData[t.id].c : '',
                f: activeDateData[t.id]?.f !== undefined ? activeDateData[t.id].f : '',
                completed: activeDateData[t.id]?.completed || false
            }));

            const totalP = meals.reduce((acc, m) => acc + (Number(m.p) || 0), 0);
            const totalC = meals.reduce((acc, m) => acc + (Number(m.c) || 0), 0);
            const totalF = meals.reduce((acc, m) => acc + (Number(m.f) || 0), 0);
            const totalCals = (totalP * 4) + (totalC * 4) + (totalF * 9);

            const percP = Math.min(100, (totalP / (state.settings.goals.p || 1)) * 100);
            const percC = Math.min(100, (totalC / (state.settings.goals.c || 1)) * 100);
            const percF = Math.min(100, (totalF / (state.settings.goals.f || 1)) * 100);

            const remP = state.settings.goals.p - totalP;
            const remC = state.settings.goals.c - totalC;
            const remF = state.settings.goals.f - totalF;

            const activeMeal = meals.find(m => m.id === state.activeMealId) || meals[0];
            const adaptive = calculateAdaptiveAllocation(meals, activeMeal, remP, remC, remF, state.settings.goals);

            const formatDiffBadge = (diff) => {
                if (diff > 0) return `<span class="text-[10px] text-stone-400 font-bold ml-1">(Falta ${diff}g)</span>`;
                if (diff < 0) return `<span class="text-[10px] text-emerald-600 font-black ml-1">(+${Math.abs(diff)}g)</span>`;
                return `<span class="text-[10px] text-emerald-600 font-black ml-1">(Exacto ✓)</span>`;
            };

            // Barras de progreso
            const barP = document.getElementById('progress_p_bar');
            const textP = document.getElementById('progress_p_text');
            if (barP) barP.style.width = `${percP}%`;
            if (textP) textP.innerHTML = `${totalP} / ${state.settings.goals.p}g ${formatDiffBadge(remP)}`;

            const barC = document.getElementById('progress_c_bar');
            const textC = document.getElementById('progress_c_text');
            if (barC) barC.style.width = `${percC}%`;
            if (textC) textC.innerHTML = `${totalC} / ${state.settings.goals.c}g ${formatDiffBadge(remC)}`;

            const barF = document.getElementById('progress_f_bar');
            const textF = document.getElementById('progress_f_text');
            if (barF) barF.style.width = `${percF}%`;
            if (textF) textF.innerHTML = `${totalF} / ${state.settings.goals.f}g ${formatDiffBadge(remF)}`;

            const calsText = document.getElementById('total_cals_ref');
            if (calsText) calsText.textContent = totalCals;

            // Badges de cada comida en el grid
            meals.forEach(m => {
                const mealBtnBadge = document.getElementById(`meal_btn_badge_${m.id}`);
                if (mealBtnBadge) {
                    const pText = m.targetP > 0 ? `${Number(m.p)||0}/${m.targetP}P` : `${Number(m.p)||0}P`;
                    const cText = m.targetC > 0 ? `${Number(m.c)||0}/${m.targetC}C` : `${Number(m.c)||0}C`;
                    const fText = m.targetF > 0 ? `${Number(m.f)||0}/${m.targetF}G` : `${Number(m.f)||0}G`;
                    mealBtnBadge.textContent = `${pText} · ${cText} · ${fText}`;
                }
            });

            // Badge Inteligente de Comida Activa
            const remBadge = document.getElementById('active_meal_rem_badge');
            if (remBadge) {
                if (activeMeal.completed) {
                    remBadge.className = "inline-block text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-700";
                    remBadge.innerHTML = `¡Comida Lista! 😋`;
                } else if (adaptive.sugP > 0 || adaptive.sugC > 0 || adaptive.sugF > 0) {
                    const badgeTitle = adaptive.isAdapted ? '🌱 Meta adaptada en esta comida:' : (adaptive.isManual ? '🎯 Meta de esta comida:' : '💡 Sugerido en esta comida:');
                    const badgeClass = adaptive.isAdapted ? 'bg-orange-50 text-orange-700 border border-orange-200' : (adaptive.isManual ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-stone-100 text-stone-600 border border-stone-200');
                    remBadge.className = `inline-block text-[11px] font-extrabold px-3 py-0.5 rounded-full ${badgeClass}`;
                    remBadge.innerHTML = `${badgeTitle} <span class="text-rose-500 mx-0.5">${adaptive.sugP}P</span> · <span class="text-amber-500 mx-0.5">${adaptive.sugC}C</span> · <span class="text-teal-600 mx-0.5">${adaptive.sugF}G</span>`;
                } else {
                    remBadge.className = "inline-block text-xs font-bold text-stone-400";
                    remBadge.innerHTML = `Metas completadas 🎉`;
                }

        }

        // --- RENDER PRINCIPAL ---
        function render() {
            const app = document.getElementById('app');
            const { settings, history, currentDate, activeMealId, slideDir } = state;
            const activeDateData = history[currentDate] || {};

            const meals = settings.templates.map(t => ({
                id: t.id,
                name: t.name,
                targetP: parseInt(t.targetP, 10) || 0,
                targetC: parseInt(t.targetC, 10) || 0,
                targetF: parseInt(t.targetF, 10) || 0,
                p: activeDateData[t.id]?.p !== undefined ? activeDateData[t.id].p : '',
                c: activeDateData[t.id]?.c !== undefined ? activeDateData[t.id].c : '',
                f: activeDateData[t.id]?.f !== undefined ? activeDateData[t.id].f : '',
                completed: activeDateData[t.id]?.completed || false
            }));

            const totalP = meals.reduce((acc, m) => acc + (Number(m.p) || 0), 0);
            const totalC = meals.reduce((acc, m) => acc + (Number(m.c) || 0), 0);
            const totalF = meals.reduce((acc, m) => acc + (Number(m.f) || 0), 0);
            const totalCals = (totalP * 4) + (totalC * 4) + (totalF * 9);
            const goalCals = (settings.goals.p * 4) + (settings.goals.c * 4) + (settings.goals.f * 9);

            const remP = settings.goals.p - totalP;
            const remC = settings.goals.c - totalC;
            const remF = settings.goals.f - totalF;

            const percP = Math.min(100, (totalP / (settings.goals.p || 1)) * 100);
            const percC = Math.min(100, (totalC / (settings.goals.c || 1)) * 100);
            const percF = Math.min(100, (totalF / (settings.goals.f || 1)) * 100);

            let activeMeal = meals.find(m => m.id === activeMealId);
            if (!activeMeal) {
                activeMeal = meals[0];
                state.activeMealId = activeMeal.id;
            }

            const adaptive = calculateAdaptiveAllocation(meals, activeMeal, remP, remC, remF, settings.goals);
            const goalsMet = totalP >= settings.goals.p && totalC >= settings.goals.c && totalF >= settings.goals.f;
            const streak = calculateStreak();

            const formatDiffBadge = (diff) => {
                if (diff > 0) return `<span class="text-[10px] text-stone-400 font-bold ml-1">(Falta ${diff}g)</span>`;
                if (diff < 0) return `<span class="text-[10px] text-emerald-600 font-black ml-1">(+${Math.abs(diff)}g)</span>`;
                return `<span class="text-[10px] text-emerald-600 font-black ml-1">(Exacto ✓)</span>`;
            };

            app.innerHTML = `
                <!-- HEADER -->
                <div class="flex flex-col px-5 pt-[max(1.2rem,env(safe-area-inset-top))] pb-3 bg-stone-50 z-20 border-b border-stone-200/60 shadow-sm shrink-0">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2">
                                <h2 class="text-2xl font-black text-stone-800 tracking-tight">
                                    ${settings.profile?.name ? `¡Hola, ${settings.profile.name}!` : '¡Hola! 👋'}
                                </h2>
                                ${streak > 0 ? `<div class="flex items-center gap-1 bg-amber-500/10 text-amber-600 px-2.5 py-0.5 rounded-full text-xs font-black border border-amber-200">${Icons.Flame} <span>${streak}d</span></div>` : ''}
                            </div>
                            <p class="text-stone-500 font-bold text-sm mt-1 flex items-center gap-1.5">
                                <button onclick="changeDate(-1)" class="p-1 hover:bg-stone-200 rounded-full active:scale-90 transition-transform">${Icons.Left}</button>
                                <button onclick="openModal('calendar')" class="capitalize min-w-[75px] text-center flex items-center justify-center gap-1.5 px-2 py-1 rounded-lg hover:bg-stone-200 active:scale-95 transition-all text-stone-700 font-extrabold">
                                    ${formatDisplayDate(currentDate)} ${Icons.Calendar}
                                </button>
                                <button onclick="changeDate(1)" class="p-1 hover:bg-stone-200 rounded-full active:scale-90 transition-transform">${Icons.Right}</button>
                                ${currentDate !== getLocalDateStr() ? `<span onclick="jumpToToday()" class="text-[10px] font-black text-amber-600 ml-1 cursor-pointer bg-amber-100 px-2 py-0.5 rounded-full uppercase tracking-wider active:scale-95">Hoy</span>` : ''}
                            </p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openModal('aiHub')" class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white active:scale-90 transition-transform shadow-md">${Icons.Sparkles}</button>
                            <button onclick="openModal('settings')" class="w-10 h-10 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 active:scale-90 transition-transform shadow-sm border border-stone-200">${Icons.Settings}</button>
                        </div>
                    </div>
                </div>

                <!-- MAIN SCROLL -->
                <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 pb-8 overflow-x-hidden">
                    <div class="flex flex-col gap-4 ${slideDir === 'next' ? 'slide-in-next' : 'slide-in-prev'}">
                        
                        <!-- RESUMEN DE METAS -->
                        <div class="rounded-3xl p-5 shadow-sm border flex flex-col gap-4 transition-all ${goalsMet ? 'bg-emerald-50 border-emerald-300 glow-card' : 'bg-white border-stone-200/80'}">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h1 class="text-xl font-black text-stone-800">${goalsMet ? '¡Metas Logradas! 🎉' : 'Resumen del Día'}</h1>
                                    <span class="text-xs font-bold text-stone-400">Ref. Calórica: <strong id="total_cals_ref" class="text-stone-600">${totalCals}</strong> / ${goalCals} kcal</span>
                                </div>
                                <button onclick="openModal('resetConfirm')" class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-400 active:scale-90">${Icons.Reset}</button>
                            </div>
                            <div class="space-y-3">
                                <div>
                                    <div class="flex justify-between text-xs font-black mb-1">
                                        <span class="text-rose-500 uppercase">Proteínas</span>
                                        <span id="progress_p_text" class="text-stone-600 font-bold">${totalP} / ${settings.goals.p}g ${formatDiffBadge(remP)}</span>
                                    </div>
                                    <div class="w-full bg-rose-50 rounded-full h-3 border border-rose-100 overflow-hidden"><div id="progress_p_bar" class="bg-gradient-to-r from-rose-400 to-pink-500 h-full transition-all duration-300" style="width: ${percP}%"></div></div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs font-black mb-1">
                                        <span class="text-amber-500 uppercase">Carbohidratos</span>
                                        <span id="progress_c_text" class="text-stone-600 font-bold">${totalC} / ${settings.goals.c}g ${formatDiffBadge(remC)}</span>
                                    </div>
                                    <div class="w-full bg-amber-50 rounded-full h-3 border border-amber-100 overflow-hidden"><div id="progress_c_bar" class="bg-gradient-to-r from-amber-400 to-orange-400 h-full transition-all duration-300" style="width: ${percC}%"></div></div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs font-black mb-1">
                                        <span class="text-teal-500 uppercase">Grasas</span>
                                        <span id="progress_f_text" class="text-stone-600 font-bold">${totalF} / ${settings.goals.f}g ${formatDiffBadge(remF)}</span>
                                    </div>
                                    <div class="w-full bg-teal-50 rounded-full h-3 border border-teal-100 overflow-hidden"><div id="progress_f_bar" class="bg-gradient-to-r from-teal-400 to-emerald-500 h-full transition-all duration-300" style="width: ${percF}%"></div></div>
                                </div>
                            </div>
                        </div>

                        <!-- SELECTOR DE COMIDAS -->
                        <div class="grid grid-cols-2 gap-2.5">
                            ${meals.map(m => {
                                const pText = m.targetP > 0 ? `${Number(m.p)||0}/${m.targetP}P` : `${Number(m.p)||0}P`;
                                const cText = m.targetC > 0 ? `${Number(m.c)||0}/${m.targetC}C` : `${Number(m.c)||0}C`;
                                const fText = m.targetF > 0 ? `${Number(m.f)||0}/${m.targetF}G` : `${Number(m.f)||0}G`;
                                return `
                                    <button onclick="setActiveMeal('${m.id}')" class="relative p-3 rounded-2xl flex flex-col items-start transition-all active:scale-95 text-left border ${activeMealId === m.id ? 'bg-white border-stone-400 shadow-md transform scale-[1.02]' : 'bg-stone-100/70 border-transparent'}">
                                        <span class="text-xs font-black truncate w-full ${activeMealId === m.id ? 'text-stone-800' : 'text-stone-500'}">${m.name}</span>
                                        <span id="meal_btn_badge_${m.id}" class="text-[11px] font-bold mt-1 ${activeMealId === m.id ? 'text-stone-600' : 'text-stone-400'}">${pText} · ${cText} · ${fText}</span>
                                        ${m.completed ? `<div class="absolute top-3 right-3 text-emerald-500">${Icons.Check}</div>` : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- DETALLE COMIDA ACTIVA -->
                        <div class="flex flex-col bg-white rounded-3xl shadow-sm border transition-colors ${activeMeal.completed ? 'border-emerald-200 bg-emerald-50/20' : 'border-stone-200'}">
                            <div class="text-center p-4 pb-2">
                                <h2 class="text-xl font-black text-stone-800">${activeMeal.name}</h2>
                                <div class="h-6 mt-1 flex justify-center items-center">
                                    <div id="active_meal_rem_badge">
                                        ${activeMeal.completed ? `
                                            <span class="text-emerald-600 text-xs font-black bg-emerald-100 px-3 py-0.5 rounded-full">¡Comida Lista! 😋</span>
                                        ` : (adaptive.sugP > 0 || adaptive.sugC > 0 || adaptive.sugF > 0) ? `
                                            <span class="inline-block text-[11px] font-extrabold px-3 py-0.5 rounded-full border ${adaptive.isAdapted ? 'bg-orange-50 text-orange-700 border-orange-200' : (adaptive.isManual ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-stone-100 text-stone-600 border-stone-200')}">
                                                ${adaptive.isAdapted ? '🌱 Meta adaptada en esta comida:' : (adaptive.isManual ? '🎯 Meta de esta comida:' : '💡 Sugerido en esta comida:')} 
                                                <span class="text-rose-500 mx-0.5">${adaptive.sugP}P</span> · <span class="text-amber-500 mx-0.5">${adaptive.sugC}C</span> · <span class="text-teal-600 mx-0.5">${adaptive.sugF}G</span>
                                            </span>
                                        ` : `
                                            <span class="text-stone-400 text-xs font-bold">Metas completadas 🎉</span>
                                        `}
                                    </div>
                                </div>
                            </div>

                            <!-- INPUTS PRO, CARB, GRASA -->
                            <div class="grid grid-cols-3 px-3 py-3 gap-2">
                                <div class="flex flex-col items-center bg-rose-50/50 rounded-2xl p-2.5 border border-rose-100">
                                    <span class="text-rose-500 font-black text-xs uppercase tracking-wider">Pro</span>
                                    <input id="active_input_p" type="number" inputmode="numeric" pattern="[0-9]*" value="${activeMeal.p}" oninput="handleMacroInputLive('p', this.value)" class="w-full text-center bg-transparent text-3xl font-black text-rose-600 outline-none my-1" placeholder="0">
                                    <div class="w-full grid grid-cols-2 gap-1 mt-auto">
                                        <button type="button" onclick="adjustMacroLive('p', -5)" class="py-1 bg-white shadow-sm border border-rose-100 rounded-lg text-rose-500 font-black text-xs active:scale-90">-5</button>
                                        <button type="button" onclick="adjustMacroLive('p', 5)" class="py-1 bg-white shadow-sm border border-rose-100 rounded-lg text-rose-500 font-black text-xs active:scale-90">+5</button>
                                    </div>
                                </div>
                                <div class="flex flex-col items-center bg-amber-50/50 rounded-2xl p-2.5 border border-amber-100">
                                    <span class="text-amber-500 font-black text-xs uppercase tracking-wider">Carb</span>
                                    <input id="active_input_c" type="number" inputmode="numeric" pattern="[0-9]*" value="${activeMeal.c}" oninput="handleMacroInputLive('c', this.value)" class="w-full text-center bg-transparent text-3xl font-black text-amber-500 outline-none my-1" placeholder="0">
                                    <div class="w-full grid grid-cols-2 gap-1 mt-auto">
                                        <button type="button" onclick="adjustMacroLive('c', -5)" class="py-1 bg-white shadow-sm border border-amber-100 rounded-lg text-amber-500 font-black text-xs active:scale-90">-5</button>
                                        <button type="button" onclick="adjustMacroLive('c', 5)" class="py-1 bg-white shadow-sm border border-amber-100 rounded-lg text-amber-500 font-black text-xs active:scale-90">+5</button>
                                    </div>
                                </div>
                                <div class="flex flex-col items-center bg-teal-50/50 rounded-2xl p-2.5 border border-teal-100">
                                    <span class="text-teal-600 font-black text-xs uppercase tracking-wider">Grasa</span>
                                    <input id="active_input_f" type="number" inputmode="numeric" pattern="[0-9]*" value="${activeMeal.f}" oninput="handleMacroInputLive('f', this.value)" class="w-full text-center bg-transparent text-3xl font-black text-teal-600 outline-none my-1" placeholder="0">
                                    <div class="w-full grid grid-cols-2 gap-1 mt-auto">
                                        <button type="button" onclick="adjustMacroLive('f', -5)" class="py-1 bg-white shadow-sm border border-teal-100 rounded-lg text-teal-600 font-black text-xs active:scale-90">-5</button>
                                        <button type="button" onclick="adjustMacroLive('f', 5)" class="py-1 bg-white shadow-sm border border-teal-100 rounded-lg text-teal-600 font-black text-xs active:scale-90">+5</button>
                                    </div>
                                </div>
                            </div>

                            <div class="p-3 pt-1">
                                <button onclick="toggleMealComplete()" class="w-full py-3.5 rounded-2xl font-black text-base transition-all flex items-center justify-center gap-2 active:scale-95 ${activeMeal.completed ? 'bg-stone-100 text-stone-500 border border-stone-200' : 'bg-stone-800 text-white shadow-md'}">
                                    ${activeMeal.completed ? 'Reabrir Comida' : 'Completar Comida'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MODALES -->
            ${renderModals()}
            `;
        }

        function renderModals() {
            if (!state.modal) return '';
            if (state.modal === 'onboarding') return renderOnboardingModal();
            if (state.modal === 'resetConfirm') return renderResetConfirmModal();
            if (state.modal === 'calendar') return renderCalendarModal();
            if (state.modal === 'settings') return renderSettingsModal();
            if (state.modal === 'modelSpecs') return renderModelSpecsModal();
            if (state.modal === 'aiHub') return renderAIHubModal();
            return '';
        }

        // --- GESTIÓN DE PLANTILLAS EN AJUSTES ---
        function addMealTemplate() {
            const newId = 'm' + Date.now();
            state.settings.templates.push({
                id: newId,
                name: 'Nueva Comida',
                targetP: '',
                targetC: '',
                targetF: ''
            });
            saveSettingsForm(false);
            render();
        }

        function removeMealTemplate(id) {
            if (state.settings.templates.length <= 1) {
                showCustomToast("Debes tener al menos 1 comida.");
                return;
            }
            state.settings.templates = state.settings.templates.filter(t => t.id !== id);
            if (state.activeMealId === id) {
                state.activeMealId = state.settings.templates[0].id;
            }
            saveSettingsForm(false);
            render();
        }

        function updateTemplateField(id, field, value) {
            const template = state.settings.templates.find(t => t.id === id);
            if (template) {
                template[field] = value;
            }
        }

        // --- ASISTENTE ONBOARDING ---
        function renderOnboardingModal() {
            const step = state.onboardingStep;
            const temp = state.tempOnboarding;
            const computed = computeMacrosEngine(temp.weight, temp.height, temp.age, temp.activity, temp.goal);

            return `
                <div class="fixed inset-0 z-[120] bg-stone-900/60 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl flex flex-col smooth-enter border border-stone-200 relative">
                        
                        <div class="flex justify-between items-center mb-6">
                            <div class="flex items-center gap-1.5">
                                ${[1, 2, 3, 4].map(s => `
                                    <div class="h-2 rounded-full transition-all duration-300 ${step === s ? 'w-8 bg-indigo-600' : (step > s ? 'w-2 bg-indigo-200' : 'w-2 bg-stone-200')}"></div>
                                `).join('')}
                            </div>
                            <button onclick="skipOnboarding()" class="text-xs font-extrabold text-stone-400 hover:text-stone-600 px-2 py-1 rounded-lg">
                                Saltar
                            </button>
                        </div>

                        ${step === 1 ? `
                            <div class="flex flex-col gap-4 smooth-enter">
                                <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-1">${Icons.User}</div>
                                <div>
                                    <h2 class="text-2xl font-black text-stone-800">¡Te damos la bienvenida! 👋</h2>
                                    <p class="text-xs font-bold text-stone-500 mt-1">Personalizaremos tus macros exactos para tu objetivo físico.</p>
                                </div>
                                <div>
                                    <label class="text-xs font-black text-stone-400 uppercase tracking-widest block mb-2">¿Cómo te llamas?</label>
                                    <input type="text" id="ob_name" value="${temp.name}" placeholder="Tu nombre..." class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-4 font-bold text-stone-800 text-lg outline-none focus:border-indigo-400">
                                </div>
                                <button onclick="nextOnboardingStep(1)" class="w-full py-4 rounded-2xl bg-stone-800 text-white font-black text-base shadow-md active:scale-95 transition-transform mt-4">Continuar</button>
                            </div>
                        ` : ''}

                        ${step === 2 ? `
                            <div class="flex flex-col gap-4 smooth-enter">
                                <div class="w-14 h-14 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center mb-1">${Icons.Scale}</div>
                                <div>
                                    <h2 class="text-2xl font-black text-stone-800">Tus Medidas 📏</h2>
                                    <p class="text-xs font-bold text-stone-500 mt-1">Servirán para calcular tu gasto calórico basal.</p>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-xs font-black text-stone-400 uppercase tracking-widest block mb-2">Peso (kg)</label>
                                        <input type="number" id="ob_weight" value="${temp.weight}" placeholder="Ej: 75" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-4 font-black text-stone-800 text-center text-xl outline-none focus:border-amber-400">
                                    </div>
                                    <div>
                                        <label class="text-xs font-black text-stone-400 uppercase tracking-widest block mb-2">Altura (cm)</label>
                                        <input type="number" id="ob_height" value="${temp.height}" placeholder="Ej: 178" class="w-full bg-stone-50 border border-stone-200 rounded-2xl p-4 font-black text-stone-800 text-center text-xl outline-none focus:border-amber-400">
                                    </div>
                                </div>
                                <div class="flex gap-2 mt-4">
                                    <button onclick="state.onboardingStep = 1; render();" class="py-4 px-5 rounded-2xl bg-stone-100 text-stone-600 font-black text-sm active:scale-95">Atrás</button>
                                    <button onclick="nextOnboardingStep(2)" class="flex-1 py-4 rounded-2xl bg-stone-800 text-white font-black text-base shadow-md active:scale-95 transition-transform">Siguiente</button>
                                </div>
                            </div>
                        ` : ''}

                        ${step === 3 ? `
                            <div class="flex flex-col gap-3.5 smooth-enter">
                                <div>
                                    <h2 class="text-xl font-black text-stone-800">Tu Enfoque y Rutina 🎯</h2>

                                </div>
                                <div>
                                    <label class="text-[11px] font-black text-stone-400 uppercase tracking-wider block mb-1">Objetivo Nutricional</label>

        // --- CALENDARIO (LUNES A DOMINGO) ---
        function renderCalendarModal() {
            const { goals } = state.settings;
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const year = state.calendarViewDate.getFullYear();
            const month = state.calendarViewDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const offset = firstDay === 0 ? 6 : firstDay - 1;

            const getDayTotals = (dStr) => {
                const dData = state.history[dStr];
                if (!dData) return { p: 0, c: 0, f: 0, met: false };
                let p = 0, c = 0, f = 0;
                Object.values(dData).forEach(m => { p += Number(m.p)||0; c += Number(m.c)||0; f += Number(m.f)||0; });
                return { p, c, f, met: p >= goals.p && c >= goals.c && f >= goals.f };
            };

            const getMondayToSundayWeek = (refDateStr = state.currentDate) => {
                const [y, m, d] = refDateStr.split('-');
                const curr = new Date(y, m - 1, d);
                const dayOfWeek = curr.getDay();
                const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                
                const monday = new Date(curr);
                monday.setDate(curr.getDate() + diffToMonday);

                const week = [];
                const dayLabels = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
                
                for (let i = 0; i < 7; i++) {
                    const dayDate = new Date(monday);
                    dayDate.setDate(monday.getDate() + i);
                    const dStr = getLocalDateStr(dayDate);
                    const isToday = dStr === getLocalDateStr();
                    const isSelected = dStr === state.currentDate;
                    week.push({
                        dateStr: dStr,
                        label: dayLabels[i],
                        dayNum: dayDate.getDate(),
                        isToday,
                        isSelected,
                        ...getDayTotals(dStr)
                    });
                }
                return week;
            };

            const weekData = getMondayToSundayWeek();
            const daysMet = weekData.filter(d => d.met).length;

            return `
                <div class="fixed inset-0 z-[100] bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">

                        ${state.calendarViewMode === 'calendar' ? `

                                <button onclick="shiftCalendarMonth(-1)" class="p-1.5 hover:bg-stone-200 rounded-xl text-stone-500">${Icons.Left}</button>
                                <span class="font-extrabold text-stone-700 capitalize text-sm">${monthNames[month]} ${year}</span>
                                <button onclick="shiftCalendarMonth(1)" class="p-1.5 hover:bg-stone-200 rounded-xl text-stone-500">${Icons.Right}</button>
                            </div>
                            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                                ${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="text-[10px] font-black text-stone-400">${d}</div>`).join('')}
                                ${Array.from({ length: offset }).map(() => `<div class="h-9"></div>`).join('')}
                                ${Array.from({ length: daysInMonth }).map((_, i) => {
                                    const dNum = i + 1;
                                    const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dNum).padStart(2, '0')}`;
                                    const isSel = dStr === state.currentDate;
                                    const isMet = getDayTotals(dStr).met;
                                    return `
                                        <button onclick="selectDate('${dStr}')" class="h-9 rounded-xl relative flex flex-col items-center justify-center font-bold text-xs ${isSel ? 'bg-stone-800 text-white shadow-md' : 'text-stone-600 hover:bg-stone-100'}">
                                            <span class="z-10">${dNum}</span>
                                            ${isMet ? `<div class="absolute bottom-1 w-1.5 h-1.5 rounded-full ${isSel ? 'bg-emerald-300' : 'bg-emerald-500'}"></div>` : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        ` : `

                                    </div>
                                    <span class="text-xs font-black text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full">${daysMet} / 7 días</span>

                                <div class="flex justify-between items-end h-24 gap-1.5 pt-2">
                                    ${weekData.map(d => `
                                        <div class="flex-1 flex flex-col items-center gap-1.5 h-full justify-end">
                                            <div onclick="selectDate('${d.dateStr}')" class="w-full rounded-lg cursor-pointer transition-all ${d.isSelected ? 'ring-2 ring-stone-800' : ''} ${d.met ? 'bg-emerald-500' : 'bg-stone-200'}" style="height: ${Math.min(100, Math.max(15, (d.p / (goals.p || 1)) * 100))}%" title="${d.label} (${d.dateStr}): ${d.p}P"></div>
                                            <span class="text-[10px] font-black ${d.isSelected ? 'text-stone-900 font-black' : (d.isToday ? 'text-indigo-600 font-black' : 'text-stone-400')}">${d.label}</span>

                                </div>
                            </div>
                        `}
                    </div>
                </div>

        // --- ACCIONES DE ESTADO ---
        function openModal(modalName) { state.modal = modalName; render(); }
        function closeModal() { state.modal = null; render(); }
        function setCalendarMode(mode) { state.calendarViewMode = mode; render(); }
        
        function setAITab(tab) { 
            if (state.aiHubTab === tab && !state.aiResult && !state.advisorError) return;
            state.aiHubTab = tab; 
            state.aiResult = null; 
            state.advisorError = null; 
            render(); 
        }
        
        function resetAIHubForm() {
            state.aiResult = null;
            state.selectedPhotoPreview = null;
            state.selectedPhotoBase64 = null;
            render();
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                state.selectedPhotoPreview = URL.createObjectURL(file);
                const reader = new FileReader();
                reader.onload = () => {
                    state.selectedPhotoBase64 = reader.result.split(',')[1];
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        function clearSelectedPhoto() {
            state.selectedPhotoPreview = null;
            state.selectedPhotoBase64 = null;
            render();
        }

        function setActiveMeal(id) { state.activeMealId = id; render(); }

        function selectModelPreset(modelStr) {
            const input = document.getElementById('set_model');
            if (input) input.value = modelStr;
        }

        function changeDate(days) {
            state.slideDir = days > 0 ? 'next' : 'prev';
            const [y, m, d] = state.currentDate.split('-');
            const dateObj = new Date(y, m - 1, d);
            dateObj.setDate(dateObj.getDate() + days);
            state.currentDate = getLocalDateStr(dateObj);
            render();
        }

        function jumpToToday() {
            const today = getLocalDateStr();
            if (state.currentDate === today) return;
            state.slideDir = state.currentDate < today ? 'next' : 'prev';
            state.currentDate = today;
            render();
        }

        function selectDate(dStr) {
            state.slideDir = dStr > state.currentDate ? 'next' : 'prev';
            state.currentDate = dStr;
            closeModal();
        }

        function shiftCalendarMonth(offset) {
            const d = new Date(state.calendarViewDate);
            d.setMonth(d.getMonth() + offset);
            state.calendarViewDate = d;
            render();
        }

        function toggleMealComplete() {
            const dayData = state.history[state.currentDate] || {};
            const mealData = dayData[state.activeMealId] || { p: '', c: '', f: '', completed: false };
            mealData.completed = !mealData.completed;
            dayData[state.activeMealId] = mealData;
            state.history[state.currentDate] = dayData;
            
            if (mealData.completed) {
                // Al completar, pasar a la siguiente comida incompleta
                const nextInc = state.settings.templates.find(t => !(state.history[state.currentDate]?.[t.id]?.completed));
                if (nextInc) state.activeMealId = nextInc.id;
            }

            saveState();
            render();
        }

        function resetCurrentDay() {
            delete state.history[state.currentDate];
            saveState();
            closeModal();
        }

        function saveSettingsForm(shouldClose = true) {
            const apiKeyInp = document.getElementById('set_apikey');
            const modelInp = document.getElementById('set_model');
            const nameInp = document.getElementById('set_name');
            const weightInp = document.getElementById('set_weight');
            const heightInp = document.getElementById('set_height');
            const ageInp = document.getElementById('set_age');
            const activityInp = document.getElementById('set_activity');
            const goalInp = document.getElementById('set_goal');
            const goalPInp = document.getElementById('set_goal_p');
            const goalCInp = document.getElementById('set_goal_c');
            const goalFInp = document.getElementById('set_goal_f');

            if (apiKeyInp) state.settings.geminiApiKey = apiKeyInp.value.trim();
            if (modelInp) state.settings.geminiModel = modelInp.value.trim() || 'gemini-2.5-flash-lite';
            if (nameInp) state.settings.profile.name = nameInp.value.trim();
            if (weightInp) state.settings.profile.weight = weightInp.value;
            if (heightInp) state.settings.profile.height = heightInp.value;
            if (ageInp) state.settings.profile.age = ageInp.value;
            if (activityInp) state.settings.profile.activity = activityInp.value;
            if (goalInp) state.settings.profile.goal = goalInp.value;
            if (goalPInp) state.settings.goals.p = parseInt(goalPInp.value, 10) || 140;
            if (goalCInp) state.settings.goals.c = parseInt(goalCInp.value, 10) || 280;
            if (goalFInp) state.settings.goals.f = parseInt(goalFInp.value, 10) || 65;

            saveState();
            if (shouldClose) {
                closeModal();
                showCustomToast("Ajustes guardados correctamente");
            }
        }

        function exportBackupData() {
            const data = { settings: state.settings, history: state.history, exportDate: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MacroTracker_Backup_${getLocalDateStr()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showCustomToast("Copia de seguridad exportada");
        }

        function importBackupData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed.settings && parsed.history) {
                        state.settings = parsed.settings;
                        state.history = parsed.history;
                        saveState();
                        closeModal();
                        showCustomToast("¡Copia de seguridad restaurada! 🎉");
                    }
                } catch(err) {
                    showCustomToast("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        function applyAIMacros(p, c, f) {
            const dayData = state.history[state.currentDate] || {};
            const mealData = dayData[state.activeMealId] || { p: 0, c: 0, f: 0, completed: false };
            mealData.p = (Number(mealData.p)||0) + p;
            mealData.c = (Number(mealData.c)||0) + c;
            mealData.f = (Number(mealData.f)||0) + f;
            dayData[state.activeMealId] = mealData;
            state.history[state.currentDate] = dayData;
            saveState();
            closeModal();
            showCustomToast("Macros añadidos a la comida");
        }

        // --- LLAMADAS A GEMINI (ROBUSTA) ---
        async function callGeminiAPI(parts) {
            const apiKey = state.settings.geminiApiKey;
            if (!apiKey || apiKey.trim() === '') {
                throw new Error("❌ ¡Falta la API Key! Ve a Ajustes (el engranaje arriba a la derecha), pega tu clave de Gemini y guarda los cambios.");
            }
            const model = state.settings.geminiModel || 'gemini-2.5-flash-lite';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            
            let res;
            try {
                res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: { temperature: 0.1 } })
                });
            } catch(netErr) {
                throw new Error("❌ Error de conexión: No se pudo contactar con los servidores de Google. Revisa tu conexión a internet.");
            }

            if (!res.ok) {
                let errorMsg = "Error desconocido";
                try {
                    const errorData = await res.json();
                    errorMsg = errorData.error?.message || errorMsg;
                } catch(e) {}

                if (res.status === 429 || errorMsg.includes("Quota") || errorMsg.includes("RESOURCE_EXHAUSTED")) {
                    throw new Error("⏳ Límite de consultas superado (Cuota agotada en este modelo). Espera un momento o selecciona otro modelo en Ajustes.");
                } else if (res.status === 404 || errorMsg.includes("not found") || errorMsg.includes("models/")) {
                    throw new Error(`❌ El modelo "${model}" no fue encontrado en Google AI. Selecciona otro en Ajustes.`);
                } else if (res.status === 400 || errorMsg.includes("API_KEY_INVALID") || errorMsg.includes("API key not valid")) {
                    throw new Error("❌ La clave API no es válida. Ve a Ajustes y asegúrate de haberla copiado correctamente.");
                } else {
                    throw new Error(`❌ Error devuelto por Google: ${errorMsg}`);
                }
            }

            const data = await res.json();
            try {
                const text = data.candidates[0].content.parts[0].text;
                const jsonMatch = text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
                if (jsonMatch) {
                    return JSON.parse(jsonMatch[0]);
                }
                return JSON.parse(text.replace(/```json/gi, '').replace(/```/g, '').trim());
            } catch(parseErr) {
                throw new Error("❌ Error procesando la respuesta de la IA. Por favor, reintenta la consulta.");
            }
        }

        async function runAIScan() {
            const query = (document.getElementById('ai_query')?.value || '').trim();
            const photoBase64 = state.selectedPhotoBase64;
            if (!query && !photoBase64) return;

            state.aiLoading = true;
            render();

            try {
                const parts = [{ text: `Eres un experto nutricionista deportivo. Analiza la comida descrita o mostrada en la foto. Calcula proteínas, carbohidratos y grasas netas en gramos. Devuelve ÚNICAMENTE este JSON: {"proteinas": (entero), "carbohidratos": (entero), "grasas": (entero), "desglose": "(resumen breve de alimentos)"}. Comida: ${query}` }];
                if (photoBase64) {
                    parts.push({ inlineData: { mimeType: "image/jpeg", data: photoBase64 } });
                }
                const result = await callGeminiAPI(parts);
                state.aiResult = { ...result, hasErrors: false };
            } catch(e) {
                state.aiResult = { proteinas: 0, carbohidratos: 0, grasas: 0, desglose: e.message, hasErrors: true };
            } finally {
                state.aiLoading = false;
                render();
            }
        }

        async function runAISolver() {
            const food = (document.getElementById('solver_food')?.value || '').trim();
            const amount = document.getElementById('solver_amount')?.value;
            const macro = document.getElementById('solver_macro')?.value;
            if (!food || !amount) return;

            state.aiLoading = true;
            render();

            try {
                const parts = [{ text: `Calcula cuántos GRAMOS de "${food}" necesito para obtener exactamente ${amount}g de ${macro}. Devuelve ÚNICAMENTE este JSON: {"proteinas": (entero en esa porción), "carbohidratos": (entero en esa porción), "grasas": (entero en esa porción), "desglose": "(Ej: Para 30g de proteína necesitas aprox 140g de pechuga cocida)"}` }];
                const result = await callGeminiAPI(parts);
                state.aiResult = { ...result, hasErrors: false };
            } catch(e) {
                state.aiResult = { proteinas: 0, carbohidratos: 0, grasas: 0, desglose: e.message, hasErrors: true };
            } finally {
                state.aiLoading = false;
                render();
            }
        }

        async function runAIAdvisor(remP, remC, remF) {
            state.aiLoading = true;
            state.advisorAdvice = null;
            state.advisorError = null;
            render();
            try {
                const parts = [{ text: `Faltan exactamente: ${remP}g Proteína, ${remC}g Carbos y ${remF}g Grasa para cumplir el objetivo del día. Dame 3 opciones de comidas para cerrar el día. Devuelve ÚNICAMENTE este JSON: {"opciones": [{"nombre": "(Título corto)", "descripcion": "(alimentos)", "macros": "(XXP / XXC / XXG)"}]}` }];
                const result = await callGeminiAPI(parts);
                state.advisorAdvice = result.opciones || [];
            } catch(e) {
                state.advisorError = e.message;
            } finally {
                state.aiLoading = false;
                render();
            }
        }

        // --- GESTIÓN DE SWIPE TÁCTIL (SIN INTERFERIR CON SCROLL) ---
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (state.modal) return;
            if (!touchStartX || !touchStartY) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = Math.abs(touchStartY - touchEndY);
            
            if (diffY < 40 && Math.abs(diffX) > 70) {
                if (diffX > 0) {
                    changeDate(1);
                } else {
                    changeDate(-1);
                }
            }
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        // Iniciar
        render();

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registrado', reg))
                    .catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
