<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configuración para Barra de Estado Inmersiva en Android / Samsung -->
    <meta name="theme-color" content="#fafaf9">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Enlace al Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <title>MacroTracker IA</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            background-color: #fafaf9; /* stone-50 */
            color: #44403c; 
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', sans-serif;
            overflow: hidden; 
            margin: 0;
            width: 100%;
            height: 100%;
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type="number"] { -moz-appearance: textfield; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        .pop-in { 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            opacity: 0; 
        }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        .slide-in-next { animation: slideInNext 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .slide-in-prev { animation: slideInPrev 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        @keyframes slideInNext {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInPrev {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .glow-card { box-shadow: 0 0 25px rgba(52, 211, 153, 0.4); }
    </style>
</head>
<body class="w-screen h-screen flex justify-center">

    <div id="root" class="w-full max-w-md h-full flex flex-col relative bg-stone-50 shadow-2xl border-x border-stone-200 overflow-hidden pb-[env(safe-area-inset-bottom)]"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Left: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
            Right: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
            Reset: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Loader: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>,
            Food: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m18 14-4-4"/><path d="M11 20.53A8.5 8.5 0 0 1 3.5 12a8.5 8.5 0 0 1 15-5.5"/><path d="m21 21-4-4"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        };

        const getLocalDateStr = (d = new Date()) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const formatDisplayDate = (dateStr) => {
            const todayStr = getLocalDateStr();
            if (dateStr === todayStr) return "Hoy";
            const [y, m, d] = dateStr.split('-');
            const dateObj = new Date(y, m - 1, d);
            const yesterday = new Date(); 
            yesterday.setDate(yesterday.getDate() - 1);
            if (dateStr === getLocalDateStr(yesterday)) return "Ayer";
            const tomorrow = new Date(); 
            tomorrow.setDate(tomorrow.getDate() + 1);
            if (dateStr === getLocalDateStr(tomorrow)) return "Mañana";
            return dateObj.toLocaleDateString('es-ES', { 
                weekday: 'short', day: 'numeric', month: 'short' 
            });
        };

        const DEFAULT_SETTINGS = {
            profile: { name: '', weight: '', age: '', height: '', goal: 'maintenance', activity: '1.375' },
            goals: { p: 130, c: 250 },
            geminiApiKey: '', 
            geminiModel: 'gemini-2.5-flash', 
            templates: [
                { id: 'm1', name: 'Desayuno', targetP: '', targetC: '' },
                { id: 'm2', name: 'Almuerzo', targetP: '', targetC: '' },
                { id: 'm3', name: 'Merienda', targetP: '', targetC: '' },
                { id: 'm4', name: 'Cena', targetP: '', targetC: '' }
            ]
        };

        const App = () => {
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [history, setHistory] = useState({});
            const [currentDate, setCurrentDate] = useState(getLocalDateStr());
            const [activeMealId, setActiveMealId] = useState(null);
            
            const [isLoaded, setIsLoaded] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showSearch, setShowSearch] = useState(false);
            const [showConfirmReset, setShowConfirmReset] = useState(false);
            const [showCalendar, setShowCalendar] = useState(false);
            
            const [slideDir, setSlideDir] = useState('next');
            const [searchQuery, setSearchQuery] = useState('');

            const touchStartX = useRef(null);
            const touchStartY = useRef(null);

            useEffect(() => {
                const savedSettings = localStorage.getItem('mt_casual_settings');
                const savedHistory = localStorage.getItem('mt_casual_history');
                
                if (savedSettings) {
                    try {
                        const parsed = JSON.parse(savedSettings);
                        setSettings({
                            ...DEFAULT_SETTINGS,
                            ...parsed,
                            profile: { ...DEFAULT_SETTINGS.profile, ...(parsed.profile || {}) },
                            goals: { ...DEFAULT_SETTINGS.goals, ...(parsed.goals || {}) },
                            templates: parsed.templates && parsed.templates.length > 0 ? parsed.templates : DEFAULT_SETTINGS.templates,
                            geminiApiKey: parsed.geminiApiKey || '',
                            geminiModel: parsed.geminiModel || 'gemini-2.5-flash'
                        });
                    } catch (e) {
                        setSettings(DEFAULT_SETTINGS);
                    }
                }
                if (savedHistory) setHistory(JSON.parse(savedHistory));
                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('mt_casual_settings', JSON.stringify(settings));
                    localStorage.setItem('mt_casual_history', JSON.stringify(history));
                }
            }, [settings, history, isLoaded]);

            useEffect(() => {
                if (settings.templates && settings.templates.length > 0 && !settings.templates.find(t => t.id === activeMealId)) {
                    setActiveMealId(settings.templates[0].id);
                }
            }, [settings.templates, currentDate, activeMealId]);

            if (!isLoaded) return null;

            const activeDateData = history[currentDate] || {};
            
            const meals = (settings.templates || []).map(t => ({
                id: t.id, 
                name: t.name, 
                targetP: parseInt(t.targetP) || 0, 
                targetC: parseInt(t.targetC) || 0,
                p: activeDateData[t.id]?.p !== undefined ? activeDateData[t.id].p : '', 
                c: activeDateData[t.id]?.c !== undefined ? activeDateData[t.id].c : '', 
                completed: activeDateData[t.id]?.completed || false
            }));

            const totalP = meals.reduce((acc, m) => acc + (Number(m.p) || 0), 0);
            const totalC = meals.reduce((acc, m) => acc + (Number(m.c) || 0), 0);
            const remP = Math.max(0, settings.goals.p - totalP);
            const remC = Math.max(0, settings.goals.c - totalC);
            const percP = Math.min(100, (totalP / settings.goals.p) * 100) || 0;
            const percC = Math.min(100, (totalC / settings.goals.c) * 100) || 0;
            const activeMeal = meals.find(m => m.id === activeMealId) || meals[0];
            const incompleteMeals = meals.filter(m => !m.completed);
            
            let displaySugP = 0; let displaySugC = 0;
            let isManualTargetP = false; let isManualTargetC = false;
            let isAdaptedP = false; let isAdaptedC = false;
            
            if (activeMeal && !activeMeal.completed) {
                const incompleteManualsP = incompleteMeals.filter(m => m.targetP > 0);
                const incompleteAutosP = incompleteMeals.filter(m => m.targetP === 0);
                const totalDesiredP = incompleteManualsP.reduce((acc, m) => acc + Math.max(0, m.targetP - (Number(m.p) || 0)), 0);

                if (activeMeal.targetP > 0) {
                    isManualTargetP = true;
                    const myDesiredP = Math.max(0, activeMeal.targetP - (Number(activeMeal.p) || 0));
                    if (totalDesiredP > remP) {
                        isAdaptedP = true;
                        displaySugP = totalDesiredP > 0 ? Math.round((myDesiredP / totalDesiredP) * remP) : 0;
                    } else {
                        displaySugP = myDesiredP;
                    }
                } else if (incompleteAutosP.length > 0) {
                    const leftoverForAutosP = Math.max(0, remP - totalDesiredP);
                    displaySugP = Math.round(leftoverForAutosP / incompleteAutosP.length);
                }

                const incompleteManualsC = incompleteMeals.filter(m => m.targetC > 0);
                const incompleteAutosC = incompleteMeals.filter(m => m.targetC === 0);
                const totalDesiredC = incompleteManualsC.reduce((acc, m) => acc + Math.max(0, m.targetC - (Number(m.c) || 0)), 0);

                if (activeMeal.targetC > 0) {
                    isManualTargetC = true;
                    const myDesiredC = Math.max(0, activeMeal.targetC - (Number(activeMeal.c) || 0));
                    if (totalDesiredC > remC) {
                        isAdaptedC = true;
                        displaySugC = totalDesiredC > 0 ? Math.round((myDesiredC / totalDesiredC) * remC) : 0;
                    } else {
                        displaySugC = myDesiredC;
                    }
                } else if (incompleteAutosC.length > 0) {
                    const leftoverForAutosC = Math.max(0, remC - totalDesiredC);
                    displaySugC = Math.round(leftoverForAutosC / incompleteAutosC.length);
                }
            }
            
            const isAnyManual = isManualTargetP || isManualTargetC;
            const isAnyAdapted = isAdaptedP || isAdaptedC;
            const greeting = settings.profile?.name ? `¡Hola, ${settings.profile.name}! 👋` : '¡Hola! 👋';
            const goalsMet = totalP >= settings.goals.p && totalC >= settings.goals.c;

            const changeDate = (days) => {
                setSlideDir(days > 0 ? 'next' : 'prev');
                const [y, m, d] = currentDate.split('-');
                const dateObj = new Date(y, m - 1, d);
                dateObj.setDate(dateObj.getDate() + days);
                setCurrentDate(getLocalDateStr(dateObj));
            };

            const jumpToToday = () => {
                const today = getLocalDateStr();
                if (currentDate === today) return;
                setSlideDir(currentDate < today ? 'next' : 'prev');
                setCurrentDate(today);
            }

            const updateMeal = (type, value) => {
                if (!activeMealId) return;
                setHistory(prev => {
                    const dayData = prev[currentDate] || {};
                    const mealData = dayData[activeMealId] || { p: '', c: '', completed: false };
                    return { ...prev, [currentDate]: { ...dayData, [activeMealId]: { ...mealData, [type]: value } } };
                });
            };

            const updateMealMacros = (newP, newC) => {
                if (!activeMealId) return;
                setHistory(prev => {
                    const dayData = prev[currentDate] || {};
                    const mealData = dayData[activeMealId] || { p: '', c: '', completed: false };
                    return { ...prev, [currentDate]: { ...dayData, [activeMealId]: { ...mealData, p: newP, c: newC } } };
                });
            };

            const toggleComplete = () => {
                if (!activeMealId) return;
                setHistory(prev => {
                    const dayData = prev[currentDate] || {};
                    const mealData = dayData[activeMealId] || { p: '', c: '', completed: false };
                    const isNowCompleted = !mealData.completed;
                    const newHistory = { ...prev, [currentDate]: { ...dayData, [activeMealId]: { ...mealData, completed: isNowCompleted } } };
                    
                    if (isNowCompleted) {
                        setTimeout(() => {
                            const nextIncomplete = settings.templates.find(t => !(newHistory[currentDate]?.[t.id]?.completed));
                            if (nextIncomplete) setActiveMealId(nextIncomplete.id);
                        }, 150);
                    }
                    return newHistory;
                });
            };

            const resetDay = () => { 
                setHistory(prev => ({ ...prev, [currentDate]: {} })); 
                setShowConfirmReset(false); 
            };

            const handleTouchStart = (e) => {
                touchStartX.current = e.targetTouches[0].clientX;
                touchStartY.current = e.targetTouches[0].clientY;
            };

            const handleTouchEnd = (e) => {
                if (showSettings || showSearch || showCalendar || showConfirmReset) return;
                if (!touchStartX.current || !touchStartY.current) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const distanceX = touchStartX.current - touchEndX;
                const distanceY = Math.abs(touchStartY.current - touchEndY);
                
                if (distanceY > 40) return;

                if (distanceX > 60) {
                    changeDate(1);
                } else if (distanceX < -60) {
                    changeDate(-1);
                }

                touchStartX.current = null;
                touchStartY.current = null;
            };

            return (
                <div 
                    className="flex flex-col h-full w-full relative bg-stone-50"
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                >
                    <div className="flex flex-col px-5 pt-[max(1.5rem,env(safe-area-inset-top))] pb-3 bg-stone-50 z-20 border-b border-stone-200/50 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] shrink-0">
                        <div className="flex justify-between items-start">
                            <div>
                                <h2 className="text-2xl font-black text-stone-800 tracking-tight">{greeting}</h2>
                                <p className="text-stone-500 font-bold text-sm mt-1 flex items-center gap-1.5">
                                    <button onClick={() => changeDate(-1)} className="p-1 hover:bg-stone-200 rounded-full transition-colors active:scale-90">
                                        <Icons.Left />
                                    </button>
                                    
                                    <button onClick={() => setShowCalendar(true)} className="capitalize min-w-[75px] text-center flex items-center justify-center gap-1.5 px-2 py-1 rounded-lg hover:bg-stone-200 active:scale-95 transition-all text-stone-600">
                                        {formatDisplayDate(currentDate)}
                                        <Icons.Calendar />
                                    </button>

                                    <button onClick={() => changeDate(1)} className="p-1 hover:bg-stone-200 rounded-full transition-colors active:scale-90">
                                        <Icons.Right />
                                    </button>
                                    {currentDate !== getLocalDateStr() && (
                                        <span className="text-[10px] font-black text-amber-600 ml-1 cursor-pointer bg-amber-100 px-2 py-0.5 rounded-full uppercase tracking-wider active:scale-95 transition-transform" onClick={jumpToToday}>Hoy</span>
                                    )}
                                </p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowSearch(true)} className="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white active:scale-90 transition-transform shadow-md">
                                    <Icons.Search />
                                </button>
                                <button onClick={() => setShowSettings(true)} className="w-10 h-10 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 active:scale-90 transition-transform shadow-sm border border-stone-200 hover:bg-stone-200">
                                    <Icons.Settings />
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto overflow-x-hidden relative">
                        <div key={currentDate} className={`p-4 flex flex-col gap-5 pb-8 ${slideDir === 'next' ? 'slide-in-next' : 'slide-in-prev'}`}>
                            
                            <div className={`rounded-3xl p-5 shadow-sm border flex flex-col gap-5 transition-colors duration-500 ${goalsMet ? 'bg-emerald-50 border-emerald-200 glow-card' : 'bg-white border-stone-100'}`}>
                                <div className="flex justify-between items-center">
                                    <h1 className="text-xl font-extrabold text-stone-800 flex items-center gap-2">
                                        {goalsMet ? '¡Metas Cumplidas! 🎉' : 'Resumen'}
                                    </h1>
                                    <button onClick={() => setShowConfirmReset(true)} className="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-400 active:scale-90 transition-transform hover:bg-stone-200">
                                        <Icons.Reset />
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-sm font-extrabold mb-1.5">
                                            <span className="text-rose-500">Proteínas</span>
                                            <span className="text-stone-500">{totalP} / {settings.goals.p}g</span>
                                        </div>
                                        <div className="w-full bg-rose-50 rounded-full h-3.5 border border-rose-100 overflow-hidden">

                                                <button onClick={() => updateMeal('c', Math.max(0, (Number(activeMeal.c) || 0) + 5))} className="py-2.5 bg-white shadow-sm border border-amber-100 rounded-xl text-amber-500 font-bold active:scale-90 transition-transform">+5</button>

                    {showConfirmReset && (

                    {showSettings && <SettingsModal onClose={() => setShowSettings(false)} settings={settings} setSettings={setSettings} />}
                    
                    {showSearch && <SearchModal 
                        onClose={() => setShowSearch(false)} 
                        apiKey={settings.geminiApiKey}
                        modelName={settings.geminiModel}
                        query={searchQuery}
                        setQuery={setSearchQuery}
                        onApply={(p, c) => { 
                            updateMealMacros((Number(activeMeal.p) || 0) + p, (Number(activeMeal.c) || 0) + c); 
                            setSearchQuery(''); 
                            setShowSearch(false); 
                        }}

            );
        };

        const CalendarModal = ({ onClose, currentDate, setCurrentDate, history, goals }) => {
            const [viewDate, setViewDate] = useState(() => {
                const [y, m, d] = currentDate.split('-');
                return new Date(y, m - 1, 1);
            });

            const changeMonth = (offset) => {
                const newDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + offset, 1);
                setViewDate(newDate);
            };

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const offset = firstDay === 0 ? 6 : firstDay - 1;

            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const checkGoalsMet = (dateStr) => {
                const dayData = history[dateStr];
                if (!dayData) return false;
                
                let totalP = 0;
                let totalC = 0;
                
                Object.values(dayData).forEach(meal => {
                    totalP += Number(meal.p) || 0;
                    totalC += Number(meal.c) || 0;
                });
                
                return totalP >= goals.p && totalC >= goals.c;
            };

            return (
                <div className="fixed inset-0 z-[100] bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl flex flex-col">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-black text-stone-800 flex items-center gap-2">
                                <Icons.Calendar /> Tu Historial
                            </h2>
                            <button onClick={onClose} className="p-2 text-stone-400 bg-stone-100 rounded-full active:scale-90 transition-transform">
                                <Icons.X />
                            </button>
                        </div>

                        <div className="flex justify-between items-center mb-4 bg-stone-50 rounded-2xl p-2 border border-stone-100">
                            <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-stone-200 rounded-xl transition-colors text-stone-500">
                                <Icons.Left />
                            </button>
                            <span className="font-extrabold text-stone-700 capitalize">
                                {monthNames[month]} {year}
                            </span>
                            <button onClick={() => changeMonth(1)} className="p-2 hover:bg-stone-200 rounded-xl transition-colors text-stone-500">
                                <Icons.Right />
                            </button>
                        </div>

                        <div className="grid grid-cols-7 gap-1 text-center mb-2">
                            {['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(day => (
                                <div key={day} className="text-[10px] font-black text-stone-400 mb-1">{day}</div>
                            ))}
                            
                            {Array.from({ length: offset }).map((_, i) => (
                                <div key={`blank-${i}`} className="h-10"></div>
                            ))}
                            
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                const isToday = dateStr === getLocalDateStr();
                                const isSelected = dateStr === currentDate;
                                const isMet = checkGoalsMet(dateStr);

                                return (
                                    <button 
                                        key={dateStr}
                                        onClick={() => { setCurrentDate(dateStr); onClose(); }}
                                        className={`h-10 rounded-xl relative flex flex-col items-center justify-center font-bold text-sm transition-all active:scale-90
                                            ${isSelected ? 'bg-stone-800 text-white shadow-md' : 'text-stone-600 hover:bg-stone-100'}
                                            ${isToday && !isSelected ? 'text-indigo-500 font-black' : ''}
                                        `}
                                    >
                                        <span className="z-10">{day}</span>
                                        {isMet && (
                                            <div className={`absolute bottom-1 w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-emerald-400' : 'bg-emerald-500'}`}></div>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                        
                        <div className="mt-4 flex items-center justify-center gap-2 text-xs font-bold text-stone-400 bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                            <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                            <span className="text-emerald-700">Días con meta cumplida</span>
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsModal = ({ onClose, settings, setSettings }) => {
            const [localSettings, setLocalSettings] = useState(() => {
                const parsed = JSON.parse(JSON.stringify(settings));
                if (!parsed.templates) parsed.templates = DEFAULT_SETTINGS.templates;
                if (!parsed.profile) parsed.profile = DEFAULT_SETTINGS.profile;
                if (!parsed.goals) parsed.goals = DEFAULT_SETTINGS.goals;
                if (parsed.geminiApiKey === undefined) parsed.geminiApiKey = DEFAULT_SETTINGS.geminiApiKey;
                if (!parsed.geminiModel) parsed.geminiModel = 'gemini-2.5-flash';
                return parsed;
            });
            
            const [suggestion, setSuggestion] = useState(null);

            const calculateMagicGoals = () => {
                const w = parseFloat(localSettings.profile.weight);
                const h = parseFloat(localSettings.profile.height);
                const a = parseFloat(localSettings.profile.age);
                const goal = localSettings.profile.goal || 'maintenance';
                const activity = parseFloat(localSettings.profile.activity) || 1.375;

                if (w > 0 && h > 0 && a > 0) {
                    const bmr = (10 * w) + (6.25 * h) - (5 * a) + 5;
                    let tdee = bmr * activity;

                    if (goal === 'cut') tdee -= 500;
                    if (goal === 'bulk') tdee += 500;

                    const protPerKg = goal === 'cut' ? 2.2 : 2.0; 
                    const suggP = Math.round(w * protPerKg);
                    
                    const fatCals = w * 1 * 9;
                    const proteinCals = suggP * 4;
                    
                    let remainingCals = tdee - fatCals - proteinCals;
                    if (remainingCals < 0) remainingCals = 0;
                    const suggC = Math.round(remainingCals / 4);

                    setSuggestion({ p: suggP, c: suggC, cals: Math.round(tdee) });
                } else {
                    alert("¡Por favor llena tu peso, altura y edad para calcular!");
                }
            };

            const addMeal = () => { 
                const newMeal = { id: 'm' + Date.now(), name: 'Nueva Comida', targetP: '', targetC: '' }; 
                setLocalSettings(prev => ({...prev, templates: [...(prev.templates || []), newMeal]})); 
            };
            const removeMeal = (id) => { 
                setLocalSettings(prev => ({...prev, templates: (prev.templates || []).filter(t => t.id !== id)})); 
            };
            const updateMealField = (id, field, value) => { 
                setLocalSettings(prev => ({ 
                    ...prev, 
                    templates: (prev.templates || []).map(t => t.id === id ? {...t, [field]: value} : t) 
                })); 
            };

            return (
                <div className="fixed inset-0 z-[100] flex justify-center bg-stone-900/30 backdrop-blur-sm">

                            </button>

                                </h3>

                                        <label className="text-stone-500 font-bold text-xs block mb-1">Pega tu API Key secreta aquí:</label>
                                        <input 
                                            type="password" 
                                            value={localSettings.geminiApiKey} 
                                            onChange={e => setLocalSettings(prev => ({...prev, geminiApiKey: e.target.value}))} 
                                            className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors" 
                                            placeholder="AIzaSy..." 
                                        />
                                    </div>
                                    <div className="mt-3">
                                        <label className="text-stone-500 font-bold text-xs block mb-1">Modelo de Gemini:</label>
                                        <input 
                                            type="text" 
                                            value={localSettings.geminiModel} 
                                            onChange={e => setLocalSettings(prev => ({...prev, geminiModel: e.target.value}))} 
                                            className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors" 
                                            placeholder="gemini-2.5-flash" 
                                        />
                                    </div>
                                </div>
                            </section>

                            <section className="fade-in" style={{animationDelay: '100ms'}}>
                                <h3 className="text-sm font-extrabold text-stone-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                    <Icons.User /> Tu Perfil
                                </h3>
                                <div className="bg-white p-4 rounded-3xl border border-stone-200 shadow-sm space-y-4">
                                    <div>
                                        <label className="text-stone-500 font-bold text-xs block mb-1">¿Cómo te llamas?</label>
                                        <input type="text" value={localSettings.profile.name} onChange={e => setLocalSettings(prev => ({...prev, profile: {...prev.profile, name: e.target.value}}))} className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors" placeholder="Tu nombre..." />
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="text-stone-500 font-bold text-xs block mb-1">Peso (kg)</label>
                                            <input type="number" inputMode="numeric" pattern="[0-9]*" value={localSettings.profile.weight} onChange={e => setLocalSettings(prev => ({...prev, profile: {...prev.profile, weight: e.target.value}}))} className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors text-center" placeholder="Ej: 70" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-stone-500 font-bold text-xs block mb-1">Altura (cm)</label>
                                            <input type="number" inputMode="numeric" pattern="[0-9]*" value={localSettings.profile.height} onChange={e => setLocalSettings(prev => ({...prev, profile: {...prev.profile, height: e.target.value}}))} className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors text-center" placeholder="Ej: 175" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-stone-500 font-bold text-xs block mb-1">Edad</label>
                                            <input type="number" inputMode="numeric" pattern="[0-9]*" value={localSettings.profile.age} onChange={e => setLocalSettings(prev => ({...prev, profile: {...prev.profile, age: e.target.value}}))} className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors text-center" placeholder="Ej: 25" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-stone-500 font-bold text-xs block mb-1">Objetivo Físico</label>
                                        <select value={localSettings.profile.goal} onChange={e => setLocalSettings(prev => ({...prev, profile: {...prev.profile, goal: e.target.value}}))} className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors appearance-none">
                                            <option value="maintenance">Mantenimiento (Mantener peso)</option>
                                            <option value="cut">Definición (Perder grasa)</option>
                                            <option value="bulk">Volumen (Ganar músculo)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-stone-500 font-bold text-xs block mb-1">Días de Entrenamiento (Actividad)</label>
                                        <select value={localSettings.profile.activity} onChange={e => setLocalSettings(prev => ({...prev, profile: {...prev.profile, activity: e.target.value}}))} className="w-full bg-stone-50 rounded-xl p-3 font-bold text-stone-700 outline-none focus:bg-white focus:border-stone-300 border border-transparent transition-colors appearance-none">
                                            <option value="1.2">Sedentario (Poco o nada)</option>
                                            <option value="1.375">Ligero (1-2 días por semana)</option>
                                            <option value="1.55">Moderado (3-5 días por semana)</option>
                                            <option value="1.725">Intenso (6-7 días por semana)</option>
                                        </select>
                                    </div>
                                </div>
                            </section>

                            <section className="fade-in" style={{animationDelay: '200ms'}}>
                                <div className="flex justify-between items-end mb-3">
                                    <h3 className="text-sm font-extrabold text-stone-400 uppercase tracking-widest flex items-center gap-1.5">
                                        <Icons.Target /> Metas Diarias
                                    </h3>
                                    <button onClick={calculateMagicGoals} className="text-xs font-bold text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-full flex items-center gap-1 active:scale-95 transition-transform">
                                        <Icons.Sparkles /> Auto-calcular
                                    </button>
                                </div>
                                
                                {suggestion && (
                                    <div className="bg-emerald-50 p-4 rounded-3xl border border-emerald-200 shadow-sm mb-4 pop-in flex flex-col gap-3">
                                        <div className="text-sm text-emerald-800 font-bold text-center">
                                            <span className="block text-lg font-black mb-1">¡Cálculo Listo! 🎯</span>
                                            Gasto calórico estimado: <span className="bg-white px-2 py-0.5 rounded-md shadow-sm">{suggestion.cals} kcal</span>
                                        </div>
                                        <div className="flex justify-center gap-6 text-center my-2">
                                            <div>
                                                <div className="text-3xl font-black text-rose-500">{suggestion.p}</div>
                                                <div className="text-[10px] font-extrabold text-rose-400 uppercase tracking-widest">Proteína (g)</div>
                                            </div>
                                            <div>
                                                <div className="text-3xl font-black text-amber-500">{suggestion.c}</div>
                                                <div className="text-[10px] font-extrabold text-amber-400 uppercase tracking-widest">Carbos (g)</div>
                                            </div>
                                        </div>
                                        <div className="flex gap-2 mt-1">
                                            <button onClick={() => setSuggestion(null)} className="flex-1 py-2.5 rounded-xl bg-white text-stone-500 font-bold border border-stone-200 active:scale-95 transition-transform">Descartar</button>
                                            <button onClick={() => {
                                                setLocalSettings(prev => ({...prev, goals: { p: suggestion.p, c: suggestion.c }}));
                                                setSuggestion(null);
                                            }} className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-white font-bold shadow-md shadow-emerald-500/30 active:scale-95 transition-transform">¡Aplicar Metas!</button>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white p-4 rounded-3xl border border-stone-200 shadow-sm flex gap-4">
                                    <div className="flex-1">
                                        <label className="text-rose-500 font-bold text-xs block mb-1">Proteínas (g)</label>
                                        <input type="number" inputMode="numeric" pattern="[0-9]*" value={localSettings.goals.p} onChange={e => setLocalSettings(prev => ({...prev, goals: {...prev.goals, p: parseInt(e.target.value)||0}}))} className="w-full bg-rose-50 rounded-xl p-3 text-2xl font-black text-rose-600 outline-none border border-transparent focus:border-rose-200 transition-colors" />
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-amber-500 font-bold text-xs block mb-1">Carbos (g)</label>
                                        <input type="number" inputMode="numeric" pattern="[0-9]*" value={localSettings.goals.c} onChange={e => setLocalSettings(prev => ({...prev, goals: {...prev.goals, c: parseInt(e.target.value)||0}}))} className="w-full bg-amber-50 rounded-xl p-3 text-2xl font-black text-amber-500 outline-none border border-transparent focus:border-amber-200 transition-colors" />
                                    </div>
                                </div>
                            </section>

                            <section className="fade-in" style={{animationDelay: '300ms'}}>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-sm font-extrabold text-stone-400 uppercase tracking-widest">Tus Comidas</h3>
                                    <button onClick={addMeal} className="text-xs font-bold bg-stone-200 text-stone-600 px-3 py-1.5 rounded-full flex items-center gap-1 active:scale-95 transition-transform">
                                        <Icons.Plus /> Añadir
                                    </button>
                                </div>
                                
                                <div className="bg-white rounded-3xl border border-stone-200 shadow-sm overflow-hidden flex flex-col gap-2 p-2">
                                    {(localSettings.templates || []).map((t, idx) => (
                                        <div key={t.id} className="flex flex-col bg-stone-50 rounded-2xl p-3 border border-stone-100">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 rounded-full bg-stone-200 text-stone-500 flex items-center justify-center font-black text-xs flex-none">{idx + 1}</div>
                                                <input type="text" value={t.name} onChange={(e) => updateMealField(t.id, 'name', e.target.value)} className="flex-1 text-stone-700 font-bold text-lg outline-none bg-transparent" placeholder="Nombre de comida" />
                                                <button onClick={() => removeMeal(t.id)} className="p-2 text-red-400 hover:bg-red-50 rounded-xl transition-colors flex-none">
                                                    <Icons.Trash />
                                                </button>
                                            </div>
                                            <div className="flex gap-2 pl-11 mt-2">
                                                <div className="flex-1 relative">
                                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-stone-400">Pro:</span>
                                                    <input type="number" inputMode="numeric" pattern="[0-9]*" value={t.targetP} onChange={(e) => updateMealField(t.id, 'targetP', e.target.value)} className="w-full bg-white border border-stone-200 rounded-lg py-1.5 pl-10 pr-2 text-sm font-bold text-stone-600 outline-none" placeholder="Auto" />
                                                </div>
                                                <div className="flex-1 relative">
                                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-stone-400">Carb:</span>
                                                    <input type="number" inputMode="numeric" pattern="[0-9]*" value={t.targetC} onChange={(e) => updateMealField(t.id, 'targetC', e.target.value)} className="w-full bg-white border border-stone-200 rounded-lg py-1.5 pl-11 pr-2 text-sm font-bold text-stone-600 outline-none" placeholder="Auto" />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            <section className="pt-6 pb-2 text-center fade-in" style={{animationDelay: '400ms'}}>
                                <div className="inline-flex items-center justify-center gap-1.5 text-stone-400">
                                    <span className="text-xs font-extrabold uppercase tracking-widest">Creado por</span>
                                    <span className="bg-stone-200 text-stone-600 px-2 py-1 rounded-md text-xs font-black">Samuel Guerra</span>
                                </div>
                                <p className="text-[10px] font-bold text-stone-400 mt-2 tracking-widest uppercase">MacroTracker v1.0.0</p>
                            </section>

                        </div>

                        <div className="absolute bottom-0 left-0 w-full p-4 bg-stone-50 border-t border-stone-200 pb-[calc(1rem+env(safe-area-inset-bottom))]">
                            <button onClick={() => { setSettings(localSettings); onClose(); }} disabled={(localSettings.templates || []).length === 0} className="w-full py-4 rounded-2xl bg-stone-800 text-white font-black text-lg active:scale-95 transition-all shadow-lg shadow-stone-800/20 disabled:opacity-50">
                                Guardar Cambios
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SearchModal = ({ onClose, onApply, apiKey, modelName, query, setQuery }) => {
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);

            const analyzeText = async () => {
                if (!query.trim()) return;

                if (!apiKey || apiKey.trim() === '') {
                    setResult({
                        proteinas: 0,
                        carbohidratos: 0,
                        desglose: "❌ ¡Falta la API Key! Ve a Ajustes (el engranaje arriba a la derecha), pega tu clave de Gemini y guarda los cambios.",
                        hasErrors: true
                    });
                    return;
                }

                setLoading(true);

                try {
                    const prompt = `Eres un experto nutricionista. El usuario te dirá qué comió. 
Calcula las proteínas y carbohidratos netos aproximados. 
Devuelve ÚNICAMENTE un objeto JSON válido, sin texto adicional, sin formato markdown ni bloques de código.
Estructura obligatoria:
{
    "proteinas": (número entero),
    "carbohidratos": (número entero),
    "desglose": "(Texto breve explicando, ej: '130g Pollo (30P, 0C)')",
    "hasErrors": false
}
Comida del usuario: ${query}`;

                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName || 'gemini-2.5-flash'}:generateContent?key=${apiKey}`;
                    
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: prompt }] }],
                            generationConfig: { temperature: 0.1 }
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        const errMsg = errorData.error?.message || "Error desconocido";
                        
                        if (errMsg.includes("Quota") || response.status === 429) {
                            throw new Error("⏳ Límite de consultas superado. Espera un momento y vuelve a intentar.");
                        } else if (errMsg.includes("not found")) {
                            throw new Error(`❌ El modelo ${modelName} no fue encontrado. Verifica el nombre en los Ajustes.`);
                        } else {
                            throw new Error(`❌ Error de Google: ${errMsg}`);
                        }
                    }

                    const data = await response.json();
                    let resultText = data.candidates[0].content.parts[0].text;
                    
                    resultText = resultText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const resultJson = JSON.parse(resultText);
                    
                    setResult({
                        proteinas: parseInt(resultJson.proteinas) || 0,
                        carbohidratos: parseInt(resultJson.carbohidratos) || 0,
                        desglose: resultJson.desglose || "Cálculo realizado por IA",
                        hasErrors: resultJson.hasErrors || false
                    });

                } catch (error) {
                    console.error("Error consultando a Gemini:", error);
                    setResult({
                        proteinas: 0,
                        carbohidratos: 0,
                        desglose: error.message,
                        hasErrors: true
                    });
                } finally {
                    setLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    analyzeText();
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex justify-center bg-stone-900/30 backdrop-blur-sm">
                    <div className="w-full max-w-md h-full bg-stone-50 flex flex-col fade-in relative shadow-2xl border-x border-stone-200 pb-[env(safe-area-inset-bottom)] pt-[max(1rem,env(safe-area-inset-top))]">
                        <div className="flex justify-between items-center mb-6 mt-4 px-4 shrink-0">
                            <h2 className="text-xl font-black flex items-center gap-2 text-stone-800">
                                <Icons.Search /> Búsqueda con IA
                            </h2>
                            <button onClick={onClose} className="p-2 text-stone-400 bg-stone-200 rounded-full active:scale-90 transition-transform">
                                <Icons.X />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto flex flex-col gap-4 pb-4 px-4">
                            {!result ? (
                                <>
                                    <div className="bg-white rounded-3xl border border-stone-200 shadow-sm overflow-hidden flex flex-col">
                                        <div className="bg-indigo-50 border-b border-indigo-100 flex flex-col items-center justify-center p-6 text-center">
                                            <div className="w-16 h-16 bg-white text-indigo-400 rounded-full flex items-center justify-center mb-3 shadow-sm border border-indigo-100">
                                                <Icons.Food />
                                            </div>
                                            <span className="font-extrabold text-indigo-900 text-lg">¿Qué vas a comer?</span>
                                            <span className="text-xs text-indigo-400 font-bold mt-1 text-balance">
                                                Escribe con naturalidad (Gemini lo entenderá todo).
                                            </span>
                                        </div>
                                        
                                        <div className="p-5 bg-white">
                                            <textarea 
                                                value={query}
                                                onChange={e => setQuery(e.target.value)}
                                                onKeyDown={handleKeyDown}
                                                placeholder="Ej: 130g de salmón al horno con 200g de camote y medio aguacate..."
                                                className="w-full bg-stone-50 border border-stone-200 rounded-2xl p-4 outline-none text-stone-700 resize-none h-32 font-bold placeholder-stone-400 focus:bg-white focus:border-indigo-300 transition-colors"
                                            />
                                        </div>
                                    </div>

                                    <div className="mt-auto pt-2">
                                        <button 
                                            onClick={analyzeText} 
                                            disabled={loading || !query.trim()} 
                                            className="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-black text-lg shadow-lg shadow-purple-500/20 active:scale-95 transition-transform flex items-center justify-center gap-2 disabled:opacity-50 disabled:active:scale-100"
                                        >
                                            {loading ? <span className="animate-spin"><Icons.Loader /></span> : <Icons.Search />}
                                            {loading ? "Analizando..." : 'Analizar Alimentos'}
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col justify-center text-center fade-in">
                                    <div className="bg-white rounded-3xl p-8 border border-stone-200 shadow-sm mb-auto mt-4">
                                        <h3 className="text-2xl font-black text-stone-800 mb-8">
                                            ¡Resultados IA! 🔎
                                        </h3>
                                        <div className="flex justify-center gap-6 mb-8">
                                            <div className="flex-1 bg-rose-50 rounded-2xl p-4 border border-rose-100">
                                                <div className="text-5xl font-black text-rose-500">{result.proteinas}</div>
                                                <div className="text-sm font-extrabold text-rose-400 mt-1 uppercase tracking-widest">Pro (g)</div>
                                            </div>
                                            <div className="flex-1 bg-amber-50 rounded-2xl p-4 border border-amber-100">
                                                <div className="text-5xl font-black text-amber-500">{result.carbohidratos}</div>
                                                <div className="text-sm font-extrabold text-amber-400 mt-1 uppercase tracking-widest">Carb (g)</div>
                                            </div>
                                        </div>
                                        <div className={`text-sm font-bold bg-stone-100 p-4 rounded-2xl text-left flex flex-col gap-2 ${result.hasErrors ? 'border border-orange-200 bg-orange-50' : ''}`}>
                                            <span className="text-stone-400 uppercase text-[10px] tracking-widest font-black">Mensaje del sistema:</span>
                                            <span className={result.hasErrors ? 'text-red-500' : 'text-stone-600'}>
                                                {result.desglose}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="mt-auto space-y-3 pt-4">
                                        <button onClick={() => onApply(result.proteinas, result.carbohidratos)} disabled={result.hasErrors} className="w-full py-4 rounded-2xl bg-stone-800 text-white font-black text-lg shadow-lg shadow-stone-800/20 active:scale-95 transition-transform disabled:opacity-50">
                                            Añadir a esta comida
                                        </button>
                                        <button onClick={() => setResult(null)} className="w-full py-4 rounded-2xl bg-stone-200 text-stone-500 font-extrabold active:scale-95 transition-transform">
                                            Hacer otra búsqueda
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
